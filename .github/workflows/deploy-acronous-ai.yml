name: Deploy Acronous AI Worker

on:
  push:
    branches: [master]
    paths:
      - 'Acronous Ai/cloudflare-worker.js'
      - 'Acronous Ai/wrangler.toml'
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Acronous Ai'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'Acronous Ai'
          command: deploy cloudflare-worker.js --name acronous-ai
