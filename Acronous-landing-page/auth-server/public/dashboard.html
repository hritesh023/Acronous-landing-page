<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard - Acronous</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .apps-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }
    @media (min-width: 600px) {
      .apps-grid { grid-template-columns: 1fr 1fr; }
    }
    .app-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .app-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 24px var(--primary-glow);
    }
    .app-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }
    .app-icon.ai { background: linear-gradient(135deg, #6366f1, #22d3ee); }
    .app-icon.eq { background: linear-gradient(135deg, #ec4899, #a78bfa); }
    .app-icon.nw { background: linear-gradient(135deg, #f59e0b, #f87171); }
    .app-info h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.15rem; }
    .app-info p { font-size: 0.8rem; color: var(--text-muted); }
    .user-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .user-details span { display: block; }
    .user-details .name { font-weight: 600; font-size: 1rem; }
    .user-details .email { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.1rem; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-outline:hover { border-color: var(--error); color: var(--error); }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="card" style="max-width: 520px;">
    <div class="logo">
      <svg viewBox="0 0 80 80" fill="none">
        <rect width="80" height="80" rx="18" fill="#0a0a0f" stroke="#22223a" stroke-width="1"/>
        <text x="40" y="50" text-anchor="middle" font-size="34" font-weight="800" fill="#6366f1" font-family="sans-serif">A</text>
      </svg>
    </div>
    <h1>Acronous Apps</h1>
    <div class="user-info">
      <div class="user-details">
        <span class="name" id="userName">Loading...</span>
        <span class="email" id="userEmail"></span>
      </div>
      <button class="btn-outline" id="logoutBtn">Sign Out</button>
    </div>
    <p class="subtitle" style="text-align:left; margin-bottom:0;">Choose an app to launch</p>
    <div class="apps-grid" id="appsGrid">
      <a class="app-card" href="https://ai.acronous.com">
        <div class="app-icon ai">AI</div>
        <div class="app-info">
          <h3>Acronous AI</h3>
          <p>AI-powered chat & assistance</p>
        </div>
      </a>
      <a class="app-card" href="https://equyvo.acronous.com">
        <div class="app-icon eq">Eq</div>
        <div class="app-info">
          <h3>Equyvo</h3>
          <p>Social content & discovery</p>
        </div>
      </a>
      <a class="app-card" href="https://navigwiz.acronous.com" style="grid-column: 1/-1;">
        <div class="app-icon nw">Nw</div>
        <div class="app-info">
          <h3>Navigwiz</h3>
          <p>AI-powered browser & workspace</p>
        </div>
      </a>
    </div>
  </div>
  <script>
    (function() {
      async function loadUser() {
        try {
          const res = await fetch('/api/auth/me');
          const data = await res.json();
          if (data.user) {
            document.getElementById('userName').textContent = data.user.name;
            document.getElementById('userEmail').textContent = data.user.email;
          }
        } catch {
          window.location.href = '/login';
        }
      }
      loadUser();

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/login';
      });

      const params = new URLSearchParams(location.search);
      const token = params.get('token');
      if (token) {
        document.querySelectorAll('#appsGrid .app-card').forEach(a => {
          const url = new URL(a.href);
          url.searchParams.set('token', token);
          a.href = url.toString();
        });
      }
    })();
  </script>
</body>
</html>
